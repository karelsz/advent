<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adventní kalendář</title>
  <!-- Supabase JS Client a Centrální konfigurace -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="games/config.js"></script>
  <style>
    :root {
      --bg: #0b1a2d;
      --card-locked: #182c44;
      --card-unlocked: #c92a2a;
      --card-done: #2b8a3e;
      --gold: #ffd43b;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1a365d, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 14px;
      width: 100%;
      max-width: 480px;
    }

    header h1 {
      font-size: 1.7rem;
      margin-bottom: 4px;
    }

/* 4 adventní svíčky v záhlaví */
    .header-candles {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 6px;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 20px;
      display: inline-flex;
    }

    .header-candle {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 1.3rem;
      transition: all 0.3s ease;
      opacity: 0.35;
      filter: grayscale(1);
    }

    .header-candle.lit {
      opacity: 1;
      filter: grayscale(0) drop-shadow(0 0 8px rgba(255, 212, 59, 0.8));
      transform: scale(1.1);
    }

    .header-candle .candle-flame {
      font-size: 0.85rem;
      height: 14px;
      visibility: hidden;
    }

    .header-candle.lit .candle-flame {
      visibility: visible;
      animation: flicker 1.2s infinite alternate ease-in-out;
    }

    @keyframes flicker {
      0% { transform: scale(0.9) rotate(-3deg); filter: drop-shadow(0 0 4px #f59e0b); }
      100% { transform: scale(1.15) rotate(3deg); filter: drop-shadow(0 0 10px #fbbf24); }
    }

    .bar-actions {
      display: flex;
      gap: 6px;
    }

    .btn-bar {
      background: #334155;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Modální okno pro Adventní věnec */
/* Reálný adventní věnec s plamínky */
    .wreath-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 6px 4px;
      width: 100%;
    }

    .wreath-photo-card {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 16 / 10;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      margin: 8px 0;
      background: #000;
    }

    .wreath-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Plamínky nad svíčkami */
    .wreath-flame {
      position: absolute;
      width: 16px;
      height: 24px;
      border-radius: 50% 50% 35% 35%;
      background: radial-gradient(ellipse at bottom, #fff 15%, #ffd43b 50%, #f97316 85%, transparent 100%);
      box-shadow: 0 0 16px 6px rgba(251, 191, 36, 0.8), 0 0 35px 12px rgba(245, 158, 11, 0.5);
      transform: translate(-50%, -100%);
      display: none;
      pointer-events: none;
      animation: wreathFlicker 1.1s infinite alternate ease-in-out;
    }

    .wreath-flame.lit {
      display: block;
    }

    /* Pozice 4 plamínků nad 4 svícemi na fotografii */
    #wf-1 { left: 20%; top: 28%; }
    #wf-2 { left: 40%; top: 24%; }
    #wf-3 { left: 63%; top: 22%; }
    #wf-4 { left: 81%; top: 27%; }

    @keyframes wreathFlicker {
      0% { transform: translate(-50%, -100%) scale(0.92) rotate(-2deg); opacity: 0.9; }
      50% { transform: translate(-50%, -100%) scale(1.08) rotate(3deg); opacity: 1; }
      100% { transform: translate(-50%, -100%) scale(0.96) rotate(-1deg); opacity: 0.95; }
    }

    .wreath-desc {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-top: 6px;
    }

    .player-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 8px 14px;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .player-tag {
      cursor: pointer;
      color: var(--gold);
      font-weight: bold;
      text-decoration: underline;
    }

    .btn-stats {
      background: #334155;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 480px;
    }



    .door {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-weight: bold;
      border: 2px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .door.locked {
      background-color: var(--card-locked);
      color: #64748b;
      cursor: not-allowed;
      border-color: transparent;
    }

    .door.unlocked {
      background: linear-gradient(135deg, #d93838, var(--card-unlocked));
      color: #fff;
    }

     .door.done {
      background: linear-gradient(135deg, #2f9e44, var(--card-done));
    }

    /* Zlatý rámeček a záře, pokud držíš globální rekord dne */
    .door.champion {
      border: 3px solid #ffd43b !important;
      box-shadow: 0 0 16px rgba(255, 212, 59, 0.75), inset 0 0 8px rgba(255, 212, 59, 0.4) !important;
      position: relative;
    }

    .door.champion::after {
      content: '👑';
      position: absolute;
      top: -8px;
      right: -6px;
      font-size: 1rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }

    .door .badge {
      font-size: 0.75rem;
      margin-top: 2px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 12px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-close {
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Obrazovka s instrukcemi před hrou */
    .intro-screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px 10px;
      gap: 16px;
    }

    .intro-icon {
      font-size: 3.5rem;
      line-height: 1;
    }

    .intro-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      font-size: 1rem;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .intro-records {
      font-size: 0.85rem;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .btn-start-game {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.35);
      transition: transform 0.1s ease;
    }

    .btn-start-game:active {
      transform: scale(0.98);
    }

    canvas {
      background: #020617;
      border-radius: 8px;
      border: 1px solid #1e293b;
      display: none; /* Skryté dokud hráč neklikne na Start */
      width: 100%;
      touch-action: none;
    }

    .game-status {
      margin-top: 10px;
      font-size: 0.95rem;
      text-align: center;
      min-height: 24px;
      display: none; /* Skryté dokud hra neběží */
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .stats-table th, .stats-table td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #1e293b;
    }

    .stats-table th {
      color: #94a3b8;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎄 Adventní kalendář</h1>
      
    <!-- 4 svíčky pod nadpisem -->
    <div class="header-candles" id="headerCandles" title="4 adventní svíčky">
      <div class="header-candle" id="hc-1"><span class="candle-flame">🔥</span><span>🕯️</span></div>
      <div class="header-candle" id="hc-2"><span class="candle-flame">🔥</span><span>🕯️</span></div>
      <div class="header-candle" id="hc-3"><span class="candle-flame">🔥</span><span>🕯️</span></div>
      <div class="header-candle" id="hc-4"><span class="candle-flame">🔥</span><span>🕯️</span></div>
    </div>

    <div class="player-bar">
      <div>Hráč: <span class="player-tag" id="playerNameTag" onclick="changePlayerName()">...</span></div>
      <div class="bar-actions">
        <!-- Nové tlačítko pro vyvolání věnce -->
        <button class="btn-bar" id="btnWreath">🕯️ Věnec</button>
        <button class="btn-bar" id="btnStats">🏆 Rekordy</button>
      </div>
    </div>

  </header>

  <main class="calendar-grid" id="calendar"></main>

  <!-- Modální okno s Minihrou -->
  <div class="modal-overlay" id="gameModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Minihra</h2>
        <button class="btn-close" id="closeGameBtn">✕</button>
      </div>

      <!-- Úvodní obrazovka s instrukcemi -->
      <div class="intro-screen" id="introScreen">
        <div class="intro-icon" id="introIcon">🎁</div>
        <div class="intro-box" id="introInstructions">Načítám instrukce...</div>
        <div class="intro-records" id="introRecords"></div>
        <button class="btn-start-game" id="startGameBtn">Spustit hru 🎮</button>
      </div>

      <!-- Samotná herní plocha -->
      <canvas id="gameCanvas" width="320" height="400"></canvas>
      <div class="game-status" id="gameStatus"></div>
    </div>
  </div>

  <!-- Modální okno se Síní slávy -->
  <div class="modal-overlay" id="statsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>🏆 Síň slávy a rekordy</h2>
        <button class="btn-close" id="closeStatsBtn">✕</button>
      </div>
      <div style="width: 100%;" id="statsContent">
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 10px;">Načítám data ze Supabase...</p>
      </div>
    </div>
  </div>


<!-- Modální okno: Adventní věnec s fotografií -->
  <div class="modal-overlay" id="wreathModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="wreathModalTitle">🎄 Adventní věnec</h2>
        <button class="btn-close" id="closeWreathBtn">✕</button>
      </div>
      <div class="wreath-container">
        
        <div class="wreath-photo-card">
          <!-- Reálná vánoční fotografie adventního věnce se 4 svícemi -->
          <img class="wreath-img" src="https://images.unsplash.com/photo-1543258103-a62bdc069871?auto=format&fit=crop&w=700&q=80" alt="Adventní věnec">
          
          <!-- 4 interaktivní plamínky -->
          <div class="wreath-flame" id="wf-1"></div>
          <div class="wreath-flame" id="wf-2"></div>
          <div class="wreath-flame" id="wf-3"></div>
          <div class="wreath-flame" id="wf-4"></div>
        </div>

        <div class="wreath-desc" id="wreathDesc"></div>
      </div>
    </div>
  </div>

  <script>
    // 1. Supabase konfigurace
    const SUPABASE_URL = 'https://vzayvjzvugrwvfifznnd.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6YXl2anp2dWdyd3ZmaWZ6bm5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4OTQ0NDcsImV4cCI6MjEwODQ3MDQ0N30.ZzLPVCPGyuWG3-sH1WIC4H3ZniV3JeZT2K9VuYLhmGg';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

 // 2. Správa hráče se Supabase ověřením existence
    let playerName = localStorage.getItem('advent_player') || '';

    async function checkPlayerExistsOnline(name) {
      if (!supabaseClient) return false;
      try {
        const { data, error } = await supabaseClient
          .from('leaderboard')
          .select('player_name')
          .ilike('player_name', name.trim())
          .limit(1);
        return !error && data && data.length > 0;
      } catch (e) {
        return false;
      }
    }

    async function promptAndSetPlayerName(isChange = false) {
      let valid = false;
      while (!valid) {
        const promptMsg = isChange ? 'Zadat nové jméno hráče:' : 'Vítej v kalendáři! Jak se jmenuješ?';
        const entered = prompt(promptMsg, playerName || 'Hráč');

        if (!entered || !entered.trim()) {
          if (!playerName) playerName = 'Hráč';
          valid = true;
          break;
        }

        const trimmed = entered.trim();
        const exists = await checkPlayerExistsOnline(trimmed);

        if (exists && trimmed.toLowerCase() !== playerName.toLowerCase()) {
          const confirmSamePlayer = confirm(
            `Jméno "${trimmed}" už v kalendáři existuje!\n\nJsi to opravdu ty a chceš pokračovat ve svém postupu?\n(OK = Ano, jsem to já / Zrušit = Zadat jiné jméno)`
          );
          if (!confirmSamePlayer) {
            continue; // Uživatel nechce toto jméno, zkusí jiné
          }
        }

        playerName = trimmed;
        localStorage.setItem('advent_player', playerName);
        document.getElementById('playerNameTag').innerText = playerName;
        valid = true;
      }
      renderCalendar();
    }

    function changePlayerName() {
      promptAndSetPlayerName(true);
    }

    if (!playerName) {
      promptAndSetPlayerName(false);
    } else {
      document.getElementById('playerNameTag').innerText = playerName;
    }

    // 3. Univerzální rekordový engine řízený games/config.js
    window.adventScores = {
      isAscending: function(day) {
        const conf = window.adventConfig && window.adventConfig[day];
        return conf ? conf.order === 'asc' : false;
      },

      getUnit: function(day) {
        const conf = window.adventConfig && window.adventConfig[day];
        return conf ? conf.unit : '';
      },

      savePersonalScore: function(day, score) {
        const key = `advent_best_day_${day}_${playerName}`;
        const currentBest = localStorage.getItem(key);
        const asc = this.isAscending(day);

        if (currentBest === null) {
          localStorage.setItem(key, score);
        } else {
          const prev = parseInt(currentBest, 10);
          if (asc ? score < prev : score > prev) {
            localStorage.setItem(key, score);
          }
        }
      },

      getPersonalBest: function(day) {
        const key = `advent_best_day_${day}_${playerName}`;
        const val = localStorage.getItem(key);
        return val !== null ? parseInt(val, 10) : null;
      },

      recordScoreOnline: async function(day, score) {
        this.savePersonalScore(day, score);
        if (!supabaseClient) return;
        try {
          await supabaseClient.from('leaderboard').insert([
            { day_number: day, player_name: playerName, score: score }
          ]);
        } catch (e) {
          console.warn('Chyba zápisu do Supabase:', e);
        }
      },

      getGlobalRecord: async function(day) {
        if (!supabaseClient) return null;
        try {
          const asc = this.isAscending(day);
          const { data, error } = await supabaseClient
            .from('leaderboard')
            .select('player_name, score')
            .eq('day_number', day)
            .order('score', { ascending: asc })
            .limit(1);
          if (!error && data && data.length > 0) return data[0];
        } catch (e) {
          console.warn(e);
        }
        return null;
      }
    };

// Výpočet počtu svíček podle splněných dnů (1, 6, 13, 20)
    function getLitCandlesCount() {
      let count = 0;
      if (completedDays.includes(1)) count++;  // 1. hra
      if (completedDays.includes(6)) count++;  // 2. adventní neděle
      if (completedDays.includes(13)) count++; // 3. adventní neděle
      if (completedDays.includes(20)) count++; // 4. adventní neděle
      return count;
    }

    // Aktualizace stavu svíček v záhlaví
    function updateHeaderCandles() {
      const count = getLitCandlesCount();
      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById(`hc-${i}`);
        if (el) {
          if (i <= count) el.classList.add('lit');
          else el.classList.remove('lit');
        }
      }
    }
const wreathModal = document.getElementById('wreathModal');
    const btnWreath = document.getElementById('btnWreath');
    const closeWreathBtn = document.getElementById('closeWreathBtn');
    const wreathDesc = document.getElementById('wreathDesc');
    const wreathModalTitle = document.getElementById('wreathModalTitle');

    function showWreathModal(customTitle = null) {
      const lit = getLitCandlesCount();
      if (wreathModalTitle) wreathModalTitle.innerText = customTitle || "🎄 Adventní věnec";

      // Zapálení příslušného počtu plamínků na fotografii
      for (let i = 1; i <= 4; i++) {
        const flame = document.getElementById(`wf-${i}`);
        if (flame) {
          if (i <= lit) {
            flame.classList.add('lit');
          } else {
            flame.classList.remove('lit');
          }
        }
      }

      let descText = "";
      if (lit === 0) {
        descText = "Zatím žádná svíce nehoří. Splň <strong>1. den</strong> a zažehneš první adventní plamen!";
      } else if (lit === 1) {
        descText = "✨ <strong>1. svíce (Naděje)</strong> plápolá! Další se rozzáří po splnění <strong>6. dne</strong> (2. adventní neděle).";
      } else if (lit === 2) {
        descText = "✨✨ <strong>2. svíce (Víra)</strong> plápolají! Třetí se rozzáří po splnění <strong>13. dne</strong> (3. adventní neděle).";
      } else if (lit === 3) {
        descText = "✨✨✨ <strong>3. svíce (Radost)</strong> plápolají! Poslední se zažehne po splnění <strong>20. dne</strong> (4. adventní neděle).";
      } else {
        descText = "🌟🌟🌟🌟 <strong>4. svíce (Pokoj)!</strong> Celý věnec září a Vánoce jsou tady!";
      }

      if (wreathDesc) wreathDesc.innerHTML = descText;
      if (wreathModal) wreathModal.classList.add('active');
    }

    if (btnWreath) btnWreath.addEventListener('click', () => showWreathModal());
    if (closeWreathBtn) closeWreathBtn.addEventListener('click', () => wreathModal.classList.remove('active'));

    btnWreath.addEventListener('click', () => showWreathModal());
    closeWreathBtn.addEventListener('click', () => wreathModal.classList.remove('active'));
    
    // 4. Mřížka kalendáře
    const TOTAL_DAYS = 24;
    //const completedDays = JSON.parse(localStorage.getItem('advent_completed') || '[]');
    let completedDays = [];
    let currentGame = null;
    let activeDayNumber = null;

    const grid = document.getElementById('calendar');
    const gameModal = document.getElementById('gameModal');
    const closeGameBtn = document.getElementById('closeGameBtn');
    const canvas = document.getElementById('gameCanvas');
    const statusText = document.getElementById('gameStatus');
    const modalTitle = document.getElementById('modalTitle');

    // Elementy úvodní obrazovky
    const introScreen = document.getElementById('introScreen');
    const introInstructions = document.getElementById('introInstructions');
    const introRecords = document.getElementById('introRecords');
    const startGameBtn = document.getElementById('startGameBtn');

async function renderCalendar() {
      const championDays = new Set();
      const serverCompletedDays = new Set();

      if (supabaseClient) {
        try {
          const { data } = await supabaseClient
            .from('leaderboard')
            .select('day_number, player_name, score');

          if (data) {
            const activeDays = Object.keys(window.adventConfig || {}).map(Number);
            activeDays.forEach(d => {
              const asc = window.adventScores.isAscending(d);
              const dayScores = data.filter(item => item.day_number === d);

              if (dayScores.length > 0) {
                // Seřazení pro určení 1. místa
                dayScores.sort((a, b) => asc ? a.score - b.score : b.score - a.score);
                if (dayScores[0].player_name.trim().toLowerCase() === playerName.trim().toLowerCase()) {
                  championDays.add(d);
                }
              }

              // Zkontrolujeme, zda tento hráč už den někdy odehrál
              const hasPlayerPlayed = dayScores.some(
                item => item.player_name.trim().toLowerCase() === playerName.trim().toLowerCase()
              );
              if (hasPlayerPlayed) {
                serverCompletedDays.add(d);
                if (!completedDays.includes(d)) {
                  completedDays.push(d);
                }
              }
            });

            // Uložíme sloučený stav i do lokální mezipaměti
            localStorage.setItem('advent_completed', JSON.stringify(completedDays));
          }
        } catch (e) {
          console.warn('Nelze načíst data ze Supabase:', e);
        }
      }

      // Aktualizujeme svíčky v záhlaví podle sloučeného stavu
      updateHeaderCandles();

      grid.innerHTML = '';
      for (let day = 1; day <= TOTAL_DAYS; day++) {
        const door = document.createElement('div');
        door.className = 'door';

        const isUnlocked = window.adventConfig && window.adventConfig[day] !== undefined;
        const isDone = completedDays.includes(day) || serverCompletedDays.has(day);
        const isChamp = championDays.has(day);

        if (isChamp) {
          door.classList.add('champion');
        }

        if (isDone) {
          door.classList.add('done');
          door.innerHTML = `<span>${day}</span><span class="badge">${isChamp ? '🏆' : '⭐'}</span>`;
        } else if (isUnlocked) {
          door.classList.add('unlocked');
          door.innerHTML = `<span>${day}</span><span class="badge">🎁</span>`;
        } else {
          door.classList.add('locked');
          door.innerHTML = `<span>${day}</span><span class="badge">🔒</span>`;
        }

        door.addEventListener('click', () => {
          if (!isUnlocked && !isDone) {
            alert("Tento den ještě skřítci v dílně připravují!");
            return;
          }
          prepareGameIntro(day);
        });

        grid.appendChild(door);
      }
    }

    // Příprava meziobrazovky před startem
    async function prepareGameIntro(day) {
      activeDayNumber = day;
      gameModal.classList.add('active');

      // Zobrazíme intro, skryjeme canvas i status
      introScreen.style.display = 'flex';
      canvas.style.display = 'none';
      statusText.style.display = 'none';

      modalTitle.innerText = `Den ${day}`;
      introInstructions.innerText = "Načítám pokyny ke hře...";
      introRecords.innerHTML = "";

      const scriptId = `game-script-${day}`;
      let script = document.getElementById(scriptId);

      const showIntroDetails = async () => {
        if (window.adventGames && window.adventGames[day]) {
          currentGame = window.adventGames[day];
          modalTitle.innerText = `Den ${day}: ${currentGame.title}`;
          introInstructions.innerText = currentGame.instructions || "Připrav se na hru!";

          // Zobrazení rekordů na úvodní obrazovce
          const unit = window.adventScores.getUnit(day);
          const myBest = window.adventScores.getPersonalBest(day);
          const myBestText = myBest !== null ? `${myBest}${unit}` : "Zatím žádný";

          introRecords.innerHTML = `<div>Tvůj osobní rekord: <strong style="color: #ffd43b;">${myBestText}</strong></div>`;

          // Načtení globálního rekordu
          const globalRec = await window.adventScores.getGlobalRecord(day);
          if (globalRec) {
            introRecords.innerHTML += `<div>Rekord drží <strong>${globalRec.player_name}</strong> (${globalRec.score}${unit})</div>`;
          }
        }
      };

      if (!script) {
        script = document.createElement('script');
        script.id = scriptId;
        script.src = `games/day${day}.js`;
        script.onload = showIntroDetails;
        document.body.appendChild(script);
      } else {
        showIntroDetails();
      }
    }

startGameBtn.addEventListener('click', () => {
      if (!currentGame) return;

      // 1. Skryjeme intro
      introScreen.style.display = 'none';

      // 2. Explicitně zapneme a nastavíme canvas
      canvas.style.display = 'block';
      canvas.width = 320;
      canvas.height = 400;

      // 3. Stavový řádek
      statusText.style.display = 'block';
      statusText.innerText = "Hra běží...";

      // 4. Nastartujeme hru
     try {
        currentGame.start(canvas, statusText, (finalScore) => {
          const wasCompletedBefore = completedDays.includes(activeDayNumber);
          if (!wasCompletedBefore) {
            completedDays.push(activeDayNumber);
            localStorage.setItem('advent_completed', JSON.stringify(completedDays));
          }
          renderCalendar();

          // Pokud právě splnil den se svíčkou (1, 6, 13, 20), po chvilce ukážeme věnec
          const candleDays = [1, 6, 13, 20];
          if (!wasCompletedBefore && candleDays.includes(activeDayNumber)) {
            setTimeout(() => {
              gameModal.classList.remove('active');
              if (currentGame && currentGame.stop) currentGame.stop();
              showWreathModal("🎉 Zapálena nová adventní svíčka!");
            }, 1600);
          }          
        });
      } catch (err) {
        console.error("Chyba při startu hry:", err);
        statusText.innerText = "Chyba při startu: " + err.message;
      }
    });

    closeGameBtn.addEventListener('click', () => {
      gameModal.classList.remove('active');
      if (currentGame && currentGame.stop) currentGame.stop();

      // Pokud měla hra externí ovládací prvky (např. slider u Dne 1), schováme je
      const sContainer = document.getElementById('day1-slider-wrap');
      if (sContainer) sContainer.style.display = 'none';
    });

    // 5. Automatická síň slávy
    const statsModal = document.getElementById('statsModal');
    const btnStats = document.getElementById('btnStats');
    const closeStatsBtn = document.getElementById('closeStatsBtn');
    const statsContent = document.getElementById('statsContent');

    btnStats.addEventListener('click', async () => {
      statsModal.classList.add('active');
      statsContent.innerHTML = `<p style="color: #94a3b8; font-size: 0.9rem;">Načítám data z tabulky...</p>`;

      let rowsHtml = '';
      if (supabaseClient) {
        const { data } = await supabaseClient
          .from('leaderboard')
          .select('day_number, player_name, score');

        const activeDays = Object.keys(window.adventConfig || {}).map(Number);

        activeDays.forEach(d => {
          const asc = window.adventScores.isAscending(d);
          const unit = window.adventScores.getUnit(d);
          const myBest = window.adventScores.getPersonalBest(d);

          let top = null;
          if (data) {
            const dayScores = data.filter(item => item.day_number === d);
            if (dayScores.length > 0) {
              dayScores.sort((a, b) => asc ? a.score - b.score : b.score - a.score);
              top = dayScores[0];
            }
          }

          const myBestLabel = myBest !== null ? `${myBest}${unit}` : '-';
          const topLabel = top ? `${top.player_name} (${top.score}${unit})` : 'Zatím nehráno';

          rowsHtml += `
            <tr>
              <td><strong>Den ${d}</strong></td>
              <td style="color: #ffd43b;">${myBestLabel}</td>
              <td style="color: #38bdf8;">${topLabel}</td>
            </tr>
          `;
        });
      }

      statsContent.innerHTML = `
        <table class="stats-table">
          <thead>
            <tr>
              <th>Den</th>
              <th>Můj rekord</th>
              <th>Rekord (Všichni)</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml || '<tr><td colspan="3">Žádná data</td></tr>'}
          </tbody>
        </table>
      `;
    });

    closeStatsBtn.addEventListener('click', () => {
      statsModal.classList.remove('active');
    });

    renderCalendar();
  </script>
</body>
