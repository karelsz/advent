<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adventní kalendář</title>
  <style>
    :root {
      --bg: #0b1a2d;
      --card-locked: #182c44;
      --card-unlocked: #c92a2a;
      --card-done: #2b8a3e;
      --gold: #ffd43b;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1a365d, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 480px;
    }

    .door {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      border: 2px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .door.locked {
      background-color: var(--card-locked);
      color: #64748b;
      cursor: not-allowed;
      border-color: transparent;
    }

    .door.unlocked {
      background: linear-gradient(135deg, #d93838, var(--card-unlocked));
      color: #fff;
    }

    .door.done {
      background: linear-gradient(135deg, #2f9e44, var(--card-done));
    }

    .door .badge {
      font-size: 0.75rem;
      margin-top: 2px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 12px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-close {
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1rem;
      cursor: pointer;
    }

    canvas {
      background: #020617;
      border-radius: 8px;
      border: 1px solid #1e293b;
      display: block;
      width: 100%;
      touch-action: none;
    }

    .game-status {
      margin-top: 10px;
      font-size: 0.95rem;
      text-align: center;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎄 Adventní kalendář</h1>
    <p>Otevírej každý den novou minihru!</p>
  </header>

  <main class="calendar-grid" id="calendar"></main>

  <div class="modal-overlay" id="gameModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Minihra</h2>
        <button class="btn-close" id="closeBtn">✕</button>
      </div>
      <canvas id="gameCanvas" width="320" height="400"></canvas>
      <div class="game-status" id="gameStatus">Načítám...</div>
    </div>
  </div>

  <script>
    const TOTAL_DAYS = 24;
    const completedDays = JSON.parse(localStorage.getItem('advent_completed') || '[]');
    let currentGame = null;

    const grid = document.getElementById('calendar');
    const modal = document.getElementById('gameModal');
    const closeBtn = document.getElementById('closeBtn');
    const canvas = document.getElementById('gameCanvas');
    const statusText = document.getElementById('gameStatus');
    const modalTitle = document.getElementById('modalTitle');

    function renderCalendar() {
      grid.innerHTML = '';
      for (let day = 1; day <= TOTAL_DAYS; day++) {
        const door = document.createElement('div');
        door.className = 'door';

        // Pro testování jsou zatím otevřené dny 1 a 2
        const isUnlocked = (day <= 2);
        const isDone = completedDays.includes(day);

        if (isDone) {
          door.classList.add('done');
          door.innerHTML = `<span>${day}</span><span class="badge">⭐</span>`;
        } else if (isUnlocked) {
          door.classList.add('unlocked');
          door.innerHTML = `<span>${day}</span><span class="badge">🎁</span>`;
        } else {
          door.classList.add('locked');
          door.innerHTML = `<span>${day}</span><span class="badge">🔒</span>`;
        }

        door.addEventListener('click', () => {
          if (!isUnlocked && !isDone) {
            alert("Tento den je ještě schovaný pod sněhem!");
            return;
          }
          loadAndOpenGame(day);
        });

        grid.appendChild(door);
      }
    }

    // Dynamické načtení hry ze souboru games/dayX.js
    function loadAndOpenGame(day) {
      modal.classList.add('active');
      modalTitle.innerText = `Den ${day}`;
      statusText.innerText = "Načítám hru...";

      const scriptId = `game-script-${day}`;
      let script = document.getElementById(scriptId);

      const runGame = () => {
        if (window.adventGames && window.adventGames[day]) {
          currentGame = window.adventGames[day];
          modalTitle.innerText = `Den ${day}: ${currentGame.title}`;
          currentGame.start(canvas, statusText, () => {
            if (!completedDays.includes(day)) {
              completedDays.push(day);
              localStorage.setItem('advent_completed', JSON.stringify(completedDays));
              renderCalendar();
            }
          });
        } else {
          statusText.innerText = "Tato hra se ještě připravuje!";
        }
      };

      if (!script) {
        script = document.createElement('script');
        script.id = scriptId;
        script.src = `games/day${day}.js`;
        script.onload = runGame;
        script.onerror = () => {
          statusText.innerText = "Tato hra se ještě dokončuje v dílně skřítků!";
        };
        document.body.appendChild(script);
      } else {
        runGame();
      }
    }

    closeBtn.addEventListener('click', () => {
      modal.classList.remove('active');
      if (currentGame && currentGame.stop) {
        currentGame.stop();
      }
    });

    renderCalendar();
  </script>
</body>
</html>
